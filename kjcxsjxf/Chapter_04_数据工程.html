拒绝坏输入"],["死代码消除","过滤损坏、无关或无贡献记录","减少噪声与移动成本"],["公共子表达式消除","去重相同或近重复样本","防止偏置并节省训练计算"],["循环展开","旋转、变调、加噪等数据增强","暴露更多等价变化"],["代码生成","序列化为张量、Parquet、TFRecord等","生成训练器高效消费的工件"]]}]}],"source":[13]},{"type":"reading","title":"4.1 数据集编译（Dataset Compilation）","units":[{"title":"4.1 数据集编译（Dataset Compilation）","context":"","source":[14],"parts":[{"type":"text","text":"数据集要像代码一样版本化、单元测试和审查。"},{"type":"text","text":"删除训练集一行，相当于删除源代码一行；重训模型，相当于重新编译。"},{"type":"text","text":"训练集可以塑造参数，验证集可以塑造管道和模型选择，测试集只应用于最终泛化估计。"},{"type":"text","text":"重复样本跨分区、同一用户落在训练与测试两边、增强版本跨分区、时间特征偷看未来，都会造成数据泄漏。"}]},{"title":"4.1 数据集编译（Dataset Compilation）","context":"","source":[15],"parts":[{"type":"text","text":"模型像烤出来的面包，数据集才是面粉、酵母和配方。"},{"type":"text","text":"面包烤坏后只研究烤箱温度，却不检查面粉是否发霉，往往会一直调错地方。"}]}],"source":[14,15]},{"type":"formula","title":"4.2 数据的物理规律（Physics of Data）","units":[{"title":"4.2 数据的物理规律（Physics of Data）","context":"","source":[17],"parts":[{"type":"text","text":"“数据即代码”说明数据决定行为；数据物理学解释为什么搬运和供给数据如此昂贵。"},{"type":"text","text":"数据像真实材料一样具有“重力”和“信息密度”。"}]},{"title":"4.2.1 数据重力","context":"4.2 数据的物理规律（Physics of Data）","source":[18],"parts":[{"type":"text","text":"数据重力是移动数据的成本，主要由数据体积D_vol与带宽BW决定："}]},{"title":"4.2.1 数据重力","context":"4.2 数据的物理规律（Physics of Data）","source":[19],"parts":[{"type":"note","text":"公式用于系统诊断，而不是脱离条件的普适定律。"},{"type":"formula","text":"T_move = D_vol / BW"}]},{"title":"4.2.1 数据重力","context":"4.2 数据的物理规律（Physics of Data）","source":[20],"parts":[{"type":"text","text":"1 PB数据通过10 Gb/s链路约需9.3天；即使采用100 Gb/s专线，按理想带宽估算仍约需22小时。"},{"type":"text","text":"数据越大，围绕它建立的计算、服务、合规和依赖越多，迁移越困难。"},{"type":"text","text":"因此PB级系统常让代码和计算靠近数据，而不是把数据搬到远处的计算。"}]}],"source":[16,17,18,19,20]},{"type":"formula","title":"4.2 数据的物理规律（Physics of Data）","units":[{"title":"4.2.2 信息熵","context":"4.2 数据的物理规律（Physics of Data）","source":[21],"parts":[{"type":"text","text":"一百万张完全相同的图像具有很大体积，却只包含一张图的信息；一万张多样边缘案例体积更小，却可能更有学习价值。"},{"type":"text","text":"将信息密度与移动成本结合，可得到数据选择收益的定性关系："}]},{"title":"4.2.2 信息熵" ext","text":"混合方案通常最好。"}]}],"source":[61,62,63,64,65,66]},{"type":"reading","title":"4.5.5 数据摄取","units":[{"title":"4.5.5 数据摄取","context":"4.5 数据管道架构（Data Pipeline Architecture）","source":[67],"parts":[{"type":"text","text":"4.5.5.4 集成策略与KWS"}]},{"title":"4.5.5 数据摄取","context":"4.5 数据管道架构（Data Pipeline Architecture）","source":[68],"parts":[{"type":"text","text":"KWS流路径用消息队列缓冲实时音频并满足200 ms要求；批路径接收众包、合成和经过许可的互动数据。"},{"type":"text","text":"每个样本在入口检查采样率、时长、信噪比和格式，失败样本进入分析队列而非无声丢弃，因为它们可能代表训练集缺失的声学条件。"}]}],"source":[67,68]},{"type":"reading","title":"4.6 系统化数据处理（Systematic Data Processing）","units":[{"title":"4.6 系统化数据处理（Systematic Data Processing）","context":"","source":[70],"parts":[{"type":"text","text":"摄取把原始流解析为合法记录；处理阶段像编译器优化通道：在不破坏语义的前提下清洗、标准化并生成特征。"},{"type":"text","text":"三个不变量是：训练和服务含义一致；失败重试不改变结果；分布式执行仍能保留谱系。"}]},{"title":"4.6.1 训练—服务一致性","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[71],"parts":[{"type":"text","text":"训练阶段把金额去掉货币符号并转为浮点，服务阶段若漏掉同一步，程序可能不崩溃，模型却接收到陌生分布。"},{"type":"text","text":"仅共享函数代码仍不够：训练得到的均值、标准差、类别词表、时间窗口、STFT和MFCC参数也必须与模型一起保存并在服务中复用。"}]},{"title":"4.6.1 训练—服务一致性","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[72],"parts":[{"type":"text","text":"定义4.3　一致性命令（Consistency Imperative）： 转换逻辑与转换状态在训练和服务环境中必须保持不可变的一致语义。"}]},{"title":"4.6.1 训练—服务一致性","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[73],"parts":[{"type":"text","text":"重要性： 服务转换g_serve与训练转换g_train诱导的特征分布差异，会通过 D_KL(p(g_serve) || p(g_train)) 形成性能退化风险。"},{"type":"text","text":"区别： 数据质量关注单条记录是否干净；一致性关注整条转换路径是否对齐。"},{"type":"text","text":"常见误区： 把代码复制两份不是一致性。均值、标准差、词表和窗口参数等状态也必须同步。"}]}],"source":[69,70,71,72,73]},{"type":"reading","title":"4.6 系统化数据处理（Systematic Data Processing）","units":[{"title":"4.6.1 训练—服务一致性","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[74],"parts":[{"type":"text","text":"数值缩放应保存训练均值和标准差；类别编码要保存词表并定义unknown；时间特征要统一时区和截止时间；音频特征要固定采样率、窗长、步幅、窗函数和MFCC系数数目。"},{"type":"text","text":"KWS将原始波形转换为频谱图，再压缩为13—39个MFCC；任一参数差异都会改变模型看到的几何结构。"}]},{"title":"4.6.2 幂等变换","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[75],"parts":[{"type":"text","text":"幂等意味着同一输入执行一次或多次，最终状态相同。"},{"type":"text","text":"设置开关为“开”是幂等，反复“切换”不是。"},{"type":"text","text":"数据管道中的追加写入会在重试时制造重复，按确定键upsert则可以安全重试。"}]}],"source":[74,75]},{"type":"table","title":"4.6.2 幂等变换","units":[{"title":"4.6.2 幂等变换","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[76],"parts":[{"type":"table","rows":[["非幂等做法","失败后果","幂等替代"],["每次运行直接append","重试产生重复训练样本","按事件ID upsert或覆盖分区"],["使用当前时间作为结果","重跑输出变化","使用事件时间与固定运行版本"],["随机增强不记录种子","无法复现实验","保存种子与增强配置"],["读写同一可变目录","部分失败留下混合状态","写临时版本，验证后原子提交"]]}]}],"source":[76]},{"type":"reading","title":"4.6 系统化数据处理（Systematic Data Processing）","units":[{"title":"4.6.2 幂等变换","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[77],"parts":[{"type":"text","text":"检查点、事务提交、输入版本、确定性键与死信队列共同实现至少一次传输下的正确结果。"},{"type":"text","text":"所谓“exactly once”通常不是网络从不重复，而是重复事件不会重复改变业务状态。"}]},{"title":"4.6.3 分布式处理","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[78],"parts":[{"type":"text","text":"分布式系统的收益取决于局部计算与协调的比例。"},{"type":"text","text":"100节点各持有10 GB数据，若把1 TB全部集中，通过10 GB/s网络需要100秒，再计算5—20秒；若各节点先计算局部均值，只传100个8字节部分结果，总时间约0.05—0.2秒，可快数百到数千倍。"}]},{"title":"4.6.3 分布式处理","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[79],"parts":[{"type":"text","text":"原则： sum、mean、count等缩减操作应先在本地执行；join和笛卡尔积等扩张操作会产生不可避免的网络税。"},{"type":"text","text":"计算应跟随数据。"}]},{"title":"4.6.3 分布式处理","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[80],"parts":[{"type":"text","text":"Speedup ≤ 1 / (f_serial + f_parallel / N_workers)"}]},{"title":"4.6.3 分布式处理","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[81],"parts":[{"type":"text","text":"若存在10%的串行工作，即使无限增加worker，速度也不超过10倍。"},{"type":"text","text":"开始分布式之前，应先尝试Parquet、向量化、减少内存分配、多核和out-of-core单机处理；简单系统在性能足够时通常更可靠、更易调试。"}]}],"source":[77,78,79,80,81]},{"type":"reading","title":"4.6.4 转换谱系","units":[{"title":"4.6.4 转换谱系","context":"4.6 系统化数据处理（Systematic Data Processing）","source":[82],"parts":[{"type":"text","text":"谱系回答：这条特征来自哪个原始记录，经过哪些代码、参数、数据版本和执行环境，最终训练了哪个模型。"},{"type":"text","text":"FFT应记录窗长、步幅和窗函数；MFCC应记录系数、频率范围与滤波器；任何输出都应能回到输入、代码提交和运行ID。"},{"type":"text","text":"谱系同时服务复现、事故调试、审计和删除请求。"}]}],"source":[82]},{"type":"table","title":"4.7 数据标注（Data Labeling）","units":[{"title":"4.7 数据标注（Data Labeling）","context":"","source":[84],"parts":[{"type":"text","text":"干净特征没有标签便没有任务含义。"},{"type":"text","text":"标注是整条管道中最昂贵、最依赖人、最容易产生歧义的阶段。"},{"type":"text","text":"ground truth并不总是客观真理，而是通过测量、指南、专家和共识构造的代理目标。"}]},{"title":"4.7.1 标签类型与系统要求","context":"4.7 数据标注（Data Labeling）","source":[85],"parts":[{"type":"table","rows":[["标签类型","信息量","标注/存储成本","典型用途"],["分类","每样本一个或多个类别","最低","场景、对象存在性、KWS正负样本"],["边界框","类别+位置坐标","分类的约10—20倍时间","检测与追踪"],["分割掩码","每像素类别","极高，1920×1080约210万像素标签","自动驾驶、医学轮廓"],["自由文本/字幕","语义丰富且长度可变","指南和质量控制复杂","图文、对话、语音识别"],["序列与时间戳","帧、词或事件对齐","需要时间精度与一致性","语音、视频、传感器"]]}]}],"source":[83,84,85]},{"type":"reading","title":"4.7 数据标注（Data Labeling）","units":[{"title":"4.7.1 标签类型与系统要求","context":"4.7 数据标注（Data Labeling）","source":[86],"parts":[{"type":"text","text":"标签之外还要保存元数据：标注者、时间、指南版本、置信度、设备、环境、人口切片、复核结果和许可。"},{"type":"text","text":"模型在雨天失败时，天气元数据让覆盖缺口可定位。"}]},{"title":"4.7.2 标签准确率与共识","context":"4.7 数据标注（Data Labeling）","source":[87],"parts":[{"type":"text","text":"标签错误来自两类原因：输入本身模糊，或任务需要专业知识。"},{"type":"text","text":"前者应改善采集和质量过滤，后者应把任务路由给更合格标注者。"},{"type":"text","text":"低风险任务可抽查1%—10%；医学和自动驾驶可能需要多名专家100%复核。"}]},{"title":"4.7.2 标签准确率与共识","context":"4.7 数据标注（Data Labeling）","source":[88],"parts":[{"type":"text","text":"共识系统为同一样本收集多个独立判断，计算Fleiss' kappa等一致性指标。"},{"type":"text","text":"低一致性样本不应简单用非专家多数票强行“消除歧义”，而应升级专家并保留不确定标签。"},{"type":"text","text":"还要监控过快/过慢标注、金标准准确率、错误模式、标注者偏差和人群差异。"}]}],"source":[86,87,88]},{"type":"reading","title":"4.7 数据标注（Data Labeling）","units":[{"title":"4.7.3 AI辅助标注","context":"4.7 数据标注（Data Labeling）","source":[89],"parts":[{"type":"text","text":"AI辅助不是替代人，而是改变人把时间花在哪里："}]},{"title":"4.7.3 AI辅助标注","context":"4.7 数据标注（Data Labeling）","source":[90],"parts":[{"type":"text","text":"预标注：模型先给结果，人负责确认与修正。"},{"type":"text","text":"半监督学习：用少量标签传播到大量无标签数据。"},{"type":"text","text":"弱监督：专家编写规则或labeling functions，以较低单标签质量换取规模。"},{"type":"text","text":"主动学习：优先选择模型最不确定或最有信息的样本。"},{"type":"text","text":"迁移学习：复用已有表征，减少新任务标签数量。"}]}],"source":[89,90]},{"type":"reading","title":"4.7 数据标注（Data Labeling）","units":[{"title":"4.7.3 AI辅助标注","context":"4.7 数据标注（Data Labeling）","source":[91],"parts":[{"type":"text","text":"主动学习必须把“选样本的推理成本”也纳入预算。"},{"type":"text","text":"案例设定为1,000万候选、5万美元预算、0.50美元/标签和0.01美元/候选打分。"},{"type":"text","text":"随机达到95%可能需100万标签即50万美元；主动学习可能只需10万—20万难例标签，但扫描整个池本身又要10万美元，总成本仍超预算。"},{"type":"text","text":"若只拿10%预算做打分，约能筛50万候选并保留约9万标签预算。"},{"type":"text","text":"主动学习只有在候选池预过滤、推理更便宜或计算另有预算时才产生杠杆。"}]},{"title":"4.7.4 KWS自动标注","context":"4.7 数据标注（Data Labeling）","source":[92],"parts":[{"type":"text","text":"语音数据常已有句子级文本，可用forced alignment把已知词语对齐到毫秒级音频帧，自动切出关键词样本；模型处理清晰样本，人工复核边界、口音和噪声困难样本。"},{"type":"text","text":"自动化、人工升级与质量监控构成分层标签工厂。"}]}],"source":[91,92]},{"type":"table","title":"4.8 存储架构（Storage Architecture）","units":[{"title":"4.8 存储架构（Storage Architecture）","context":"","source":[94],"parts":[{"type":"text","text":"存储不是“把文件放在哪里”，而是让不同生命周期阶段以正确访问模式取得数据。"},{"type":"text","text":"开发需要灵活和版本；训练需要高吞吐顺序扫描；服务需要毫秒级随机访问；合规需要多年低成本不可变保留。"}]},{"title":"4.8.1 存储系统选择","context":"4.8 存储架构（Storage Architecture）","source":[95],"parts":[{"type":"table","rows":[["属性","传统数据库","数据仓库","数据湖"],["目的","事务与在线操作","分析与报表","原始多样数据长期保留"],["数据形态","结构化","结构化、列式","结构化、半结构化、非结构化"],["访问","高IOPS随机读写","大规模列扫描","低成本对象读取"],["典型ML用途","在线特征、元数据","特征工程、训练集查询","图像、音频、文本与原始日志"],["例子","PostgreSQL、MySQL","BigQuery、Redshift","S3、GCS、Azure Data Lake"]]}]}],"source":[93,94,95]},{"type":"reading","title":"4.8.1 存储系统选择","units":[{"title":"4.8.1 存储系统选择","context":"4.8 存储架构（Storage Architecture）","source":[96],"parts":[{"type":"text","text":"成熟组织 re）","units":[{"title":"4.8.3 生命周期中的存储","context":"4.8 存储架构（Storage Architecture）","source":[103],"parts":[{"type":"text","text":"开发阶段通过内容寻址和指针避免十次实验复制十份100 GB数据；训练阶段追求顺序吞吐与本地缓存；服务阶段追求低延迟随机访问，例如10,000 req/s、每请求10次特征读取需要100,000 IOPS；边缘阶段还要应对有限容量、断网缓存和模型版本回滚。"}]},{"title":"4.8.4 数据版本与复现","context":"4.8 存储架构（Storage Architecture）","source":[104],"parts":[{"type":"text","text":"DVC用Git记录小指针并把大文件放到远端；Delta Lake通过事务日志提供按时间或版本查询；模型注册表把代码提交、数据版本、特征快照和训练配置连接起来。"},{"type":"text","text":"版本控制让“上周重训CTR下降3%”从两周人工排查，缩短为比较两个快照。"}]},{"title":"4.8.4 数据版本与复现","context":"4.8 存储架构（Storage Architecture）","source":[105],"parts":[{"type":"text","text":"bash# 数据版本示例dvc add data/training.csvgit add data/training.csv.dvcgit commit -m \"Add training data v1\"dvc push"}]},{"title":"4.8.4 数据版本与复现","context":"4.8 存储架构（Storage Architecture）","source":[106],"parts":[{"type":"text","text":"git checkout abc123dvc checkout"}]},{"title":"4.8.4 数据版本与复现","context":"4.8 存储架构（Storage Architecture）","source":[107],"parts":[{"type":"text","text":"时间旅行训练必须使用预测时刻真正可见的特征。"},{"type":"text","text":"预测1月15日流失，应使用1月14日及以前特征，不能用今天已经知道“用户流失”的状态，否则产生标签泄漏。"}]},{"title":"4.8.5 特征库","context":"4.8 存储架构（Storage Architecture）","source":[108],"parts":[{"type":"text","text":"定义4.4　特征库： 特征库是集中管理机器学习特征、把特征计算与消费解耦的架构层。"}]}],"source":[103,104,105,106,107,108]},{"type":"reading","title":"4.8.5 特征库","units":[{"title":"4.8.5 特征库","context":"4.8 存储架构（Storage Architecture）","source":[109],"parts":[{"type":"text","text":"重要性： 它维护点时正确性，使历史训练特征x_(t-Δ)与实时推理特征x_t使用相同定义，结构性消除训练—服务偏差。"},{"type":"text","text":"区别： 普通数据库保存数据；特征库通常同时提供用于训练的离线列式存储与用于服务的在线键值存储。"},{"type":"text","text":"常见误区： 特征库不只是放特征的地方，它还保存计算逻辑、时间语义、谱系和更新策略。"}]},{"title":"4.8.5 特征库","context":"4.8 存储架构（Storage Architecture）","source":[110],"parts":[{"type":"text","text":"离线库需要每分钟读取数百万特征向量，在线库需要单毫秒查询；同步还要满足新鲜度、晚到事件和exactly-once状态更新。"},{"type":"text","text":"时间旅行使训练能获得历史时刻特征，而不是今天的值。"}]}],"source":[109,110]},{"type":"reading","title":"4.9 运营数据健康（Operational Data Health）","units":[{"title":"4.9 运营数据健康（Operational Data Health）","context":"","source":[112],"parts":[{"type":"text","text":"KWS上线98%，六个月后降到94%：新麦克风改变声学分布，标签指南更新但没重训，元数据模式变化没有记录。"},{"type":"text","text":"这些不是一个“坏文件”，而是数据债在系统中积累。"}]},{"title":"4.9.1 数据债类别","context":"4.9 运营数据健康（Operational Data Health）","source":[113],"parts":[{"type":"text","text":"定义4.5　数据债： 数据债是ML数据栈中隐式耦合和缺失文档产生的复利。"}]}],"source":[111,112,113]},{"type":"table","title":"4.9.1 数据债类别","units":[{"title":"4.9.1 数据债类别","context":"4.9 运营数据健康（Operational Data Health）","source":[114],"parts":[{"type":"table","rows":[["类别","典型症状","监控/修复"],["文档债","列含义、来源、负责人和假设无人知晓","数据卡、目录、所有权与谱系"],["模式债","多套日期解析、NULL补丁、版本分支","生产者—消费者契约、fail fast"],["质量债","已知标签错、重复、偏差与漂移未修","错误台账、专门容量、质量SLO"],["新鲜度债","旧训练数据与当前生产分布分离","漂移监控、触发式重训、特征TTL"]]}]}],"source":[114]},{"type":"table","title":"4.9.2 度量与预测","units":[{"title":"4.9.2 度量与预测","context":"4.9 运营数据健康（Operational Data Health）","source":[115],"parts":[{"type":"table","rows":[["数据债指标","警告示例","严重示例"],["有数据卡的数据集比例","<80%","<50%"],["有描述的字段比例","<90%","<70%"],["模式版本分支",">3",">10"],["已知标签错误率",">1%",">5%"],["距上次重训",">90天",">365天"],["相对训练基线PSI",">0.1",">0.25"]]}]}],"source":[115]},{"type":"formula","title":"4.9 运营数据健康（Operational Data Health）","units":[{"title":"4.9.2 度量与预测","context":"4.9 运营数据健康（Operational Data Health）","source":[116],"parts":[{"type":"text","text":"这些阈值用于演示运营区间的划分；实际阈值应按风险和失败代价校准。"},{"type":"text","text":"数据债按复利增长："}]},{"title":"4.9.2 度量与预测","context":"4.9 运营数据健康（Operational Data Health）","source":[117],"parts":[{"type":"note","text":"公式用于系统诊断，而不是脱离条件的普适定律。"},{"type":"formula","text":"Debt_n ≈ Debt_0 × (1 + r)^n"}]},{"title":"4.9.2 度量与预测","context":"4.9 运营数据健康（Operational Data Health）","source":[118],"parts":[{"type":"text","text":"未记录系统的累积率r可达每周期10%—30%。"},{"type":"text","text":"文档随人员离开而衰减，模式补丁增加下一次修改风险，错误标签通过伪标签和下游模型被放大，漂移持续拉开训练与服务分布。"}]},{"title":"4.9.3 修复策略","context":"4.9 运营数据健康（Operational Data Health）","source":[119],"parts":[{"type":"text","text":"文档债可按“20%数据集服务80%模型”优先，每季度安排专门文档冲刺；模式债靠显式契约和自动阻断；质量债可固定分配约10%工程容量清理已知错误；新鲜度债应由漂移触发而非只按日历重训。"},{"type":"text","text":"债务可以战略性接受，但必须可见、计价、有负责人和还款计划。"}]}],"source":[116,117,118,119]},{"type":"reading","title":"4.9.4 调试数据管道","units":[{"title":"4.9.4 调试数据管道","context":"4.9 运营数据健康（Operational Data Health）","source":[120],"parts":[{"type":"text","text":"准确率是否随时间下降？是则查漂移、新鲜度和近期上游变更。"},{"type":"text","text":"训练远高于验证？查重复、泄漏、标签噪声和过拟合。"},{"type":"text","text":"验证远高于生产？查训练—服务转换、模式与特征新鲜度。"},{"type":"text","text":"子群表现不一致？查覆盖、偏差、标注指南与定向采集。"},{"type":"text","text":"上述均否，再考虑模型容量与架构。"}]}],"source":[120]},{"type":"table","title":"4.10 谬误与陷阱（Fallacies and Pitfalls）（1/3）","units":[{"title":"4.10 谬误与陷阱（Fallacies and Pitfalls）（1/3）","context":"","source":[122],"parts":[{"type":"table","rows":[["谬误或陷阱","为什么错误","正确做法"],["数据越多一定越好","低熵重复只增加重力，收益递减","去重、覆盖缺口、主动学习与边际价值分析"],["PB迁移只需算带宽","还要重做验证、模式、谱系和依赖服务","把人力月与下游同步纳入迁移预算"],["预处理完成后可不再维护","世界与上游持续变化","统计监控、契约和自动响应"]]}]}],"source":[121,122]},{"type":"table","title":"4.10 谬误与陷阱（Fallacies and Pitfalls）（2/3）","units":[{"title":"4.10 谬误与陷阱（Fallacies and Pitfalls）（2/3）","context":"","source":[123],"parts":[{"type":"table","rows":[["谬误或陷阱","为什么错误","正确做法"],["忽略序列化成本","JSON/CSV解析可能让加速器单数利用率","转换、版本化列式二进制格式"],["高训练精度代表生产就绪","不能覆盖漂移、偏差与训练—服务偏差","独立验证与生产切片监控"],["部署后再处理特征偏差","事故发生后调试变成考古","共享转换状态、特征库和一致性测试"]]}]}],"source":[123]},{"type":"table","title":"4.10 谬误与陷阱（Fallacies and Pitfalls）（3/3）","units":[{"title":"4.10 谬误与陷阱（Fallacies and Pitfalls）（3/3）","context":"","source":[124],"parts":[{"type":"table","rows":[["谬误或陷阱","为什么错误","正确做法"],["合成数据能完全替代真实数据","生成器不会创造它没建模的现实","真实数据保证覆盖，合成数据扩大规模"],["出问题时再加数据版本控制","没有历史快照就无法复现根因","从第一次训练起关联代码、数据和模型"]]}]}],"source":[124]},{"type":"reading","title":"4.10 谬误与陷阱（Fallacies and Pitfalls）","units":[{"title":"4.10 谬误与陷阱（Fallacies and Pitfalls）","context":"","source":[125],"parts":[{"type":"text","text":"一项PB迁移的纯线时间可能只有数周，但模式迁移、质量重验、谱系更新和依赖服务同步可消耗6—9个人月。"},{"type":"text","text":"忽略序列化也会产生数量级损失：文本格式解析至少可能比Parquet、Arrow等慢10倍。"}]}],"source":[125]},{"type":"reading","title":"4.11 总结（Summary）","units":[{"title":"4.11 总结（Summary）","context":"","source":[127],"parts":[{"type":"text","text":"数据工程把原始信息转换为机器学习系统行为的基础。"},{"type":"text","text":"四支柱把采集、摄取、验证、处理、标签和存储的选择统一起来；数据级联说明为什么上游质量是最高杠杆；KWS案例说明即使几十KB的模型，也依赖跨语言、设备、噪声、隐私、标签和存储的完整系统。"}]}],"source":[126,127]},{"type":"reading","title":"4.11 总结（Summary）","units":[{"title":"4.11 总结（Summary） （1/2）","context":"","source":[128],"parts":[{"type":"text","text":"数据是源代码。 版本化、测试、审查和监控数据，与对待程序代码同等严格。"},{"type":"text","text":"数据重力与feeding tax是真实物理成本。 PB数据要求计算靠近数据，低吞吐管道会让加速器等待。"},{"type":"text","text":"四支柱必须同时成立。 高质量但不可治理，或可扩展但不可靠的管道都不能生产使用。"},{"type":"text","text":"训练—服务一致性不可谈判。 共享代码还不够，转换参数、时间语义和状态也必须一致。"},{"type":"text","text":"标注通常是串行预算瓶颈。 标签成本可比一次训练高数百到上千倍，自动化应把人留给歧义。"},{"type":"text","text":"实时与灵活都有价格。 流处理、ELT与在线计算只能在其业务价值超过额外成本时采用。"}]},{"title":"4.11 总结（Summary） （2/2）","context":"","source":[129],"parts":[{"type":"note","text":"四支柱必须同时成立。"},{"type":"text","text":"存储层决定迭代速度。 NVMe、对象存储、仓库、缓存和归档服务不同访问模式。"},{"type":"text","text":"数据债会复利。 文档、模式、质量和新鲜度必须作为运营SLO持续偿还。"}]}],"source":[128,129]},{"type":"reading","title":"4.11 总结（Summary）","units":[{"title":"4.11 总结（Summary）","context":"","source":[130],"parts":[{"type":"text","text":"数据管道像城市供水系统。"},{"type":"text","text":"水源决定水质，管道决定能否持续送达，检测站决定污染能否早发现，水塔和阀门决定高峰期是否稳定，档案记录决定事故时能否追根溯源。"},{"type":"text","text":"只把“模型”做得更聪明，不能弥补整个城市喝到错误的水。"}]}],"source":[130]},{"type":"code","title":"01_data_gravity_feeding_tax｜代码片段1","units":[{"title":"01_data_gravity_feeding_tax｜代码片段1","context":"代码案例（Jupyter Notebook）","source":[131],"parts":[{"type":"code","text":"def transfer(dataset_tb, bandwidth_gbps, egress_per_gb=0.09):\n    gb=dataset_tb*1000\n    gb_per_s=bandwidth_gbps/8\n    seconds=gb/gb_per_s\n    return {\"hours\":seconds/3600,\"days\":seconds/86400,\"egress_usd\":gb*egress_per_gb}\n\nfor bw in [10,40,100]:\n    print(bw,\"Gb/s\",transfer(1000,bw))"}]}],"source":[131]},{"type":"code","title":"01_data_gravity_feeding_tax｜代码片段2","units":[{"title":"01_data_gravity_feeding_tax｜代码片段2","context":"代码案例（Jupyter Notebook）","source":[132],"parts":[{"type":"code","text":"def feeding_tax(required_gbps, delivered_gbps):\n    utilization=min(1.0,delivered_gbps/required_gbps)\n    return utilization,1-utilization\n\nrequired=1.1\nfor delivered in [0.25,0.5,1.1,2.0]:\n    util,tax=feeding_tax(required,delivered)\n    print(f\"供给 {delivered:.2f} GB/s -> 利用率 {util:.1%}, feeding tax {tax:.1%}\")"}]}],"source":[132]},{"type":"code","title":"02_pipeline_contracts_drift_idempotency｜代码片段1","units":[{"title":"02_pipeline_contracts_drift_idempotency｜代码片段1","context":"代码案例（Jupyter Notebook）","source":[133],"parts":[{"type":"code","text":"import random,statistics\nrandom.seed(4)\nbaseline=[random.gauss(8,1.5) for _ in range(1000)]\ncurrent=[random.gauss(11.5,1.8) for _ in range(1000)]\n\ndef mechanical_check(xs):\n    return all(isinstance(x,(int,float)) and 0<=x<=24 for x in xs)\n\ndef standardized_mean_shift(a,b):\n    return abs(statistics.mean(a)-statistics.mean(b))/statistics.pstdev(a)\n\nprint(\"机械契约:\",mechanical_check(current))\nshift=standardized_mean_shift(baseline,current)\nprint(\"标准化均值漂移:\",round(shift,3),\"告警:\",shift>0.5)"}]}],"source":[133]},{"type":"code","title":"02_pipeline_contracts_drift_idempotency｜代码实践","units":[{"title":"代码逐行解析（1/2）","context":"","source":[134],"parts":[{"type":"text","text":"代码总览第 133 页 · 第 1–12 行"},{"type":"code","text":"import random,statistics"},{"type":"code","text":"random.seed(4)"},{"type":"code","text":"baseline=[random.gauss(8,1.5) for _ in range(1000)]"},{"type":"code","text":"current=[random.gauss(11.5,1.8) for _ in range(1000)]"},{"type":"code","text":"def mechanical_check(xs):"},{"type":"code","text":"    return all(isinstance(x,(int,float)) and 0<=x<=24 for x in xs)"},{"type":"code","text":"def standardized_mean_shift(a,b):"},{"type":"code","text":"    return abs(statistics.mean(a)-statistics.mean(b))/statistics.pstdev(a)"},{"type":"code","text":"print(\"机械契约:\",mechanical_check(current))"}]},{"title":"代码逐行解析（2/2）","context":"","source":[135],"parts":[{"type":"text","text":"代码总览第 133 页 · 第 13–14 行"},{"type":"code","text":"shift=standardized_mean_shift(baseline,current)"},{"type":"code","text":"print(\"标准化均值漂移:\",round(shift,3),\"告警:\",shift>0.5)"}]}],"source":[134,135]},{"type":"code","title":"02_pipeline_contracts_drift_idempotency｜代码片段2","units":[{"title":"02_pipeline_contracts_drift_idempotency｜代码片段2","context":"代码案例（Jupyter Notebook）","source":[136],"parts":[{"type":"code","text":"train_mean=statistics.mean(baseline); train_std=statistics.pstdev(baseline)\ndef transform(x,mean,std): return (x-mean)/std\ntrain_view=[transform(x,train_mean,train_std) for x in baseline[:5]]\nserve_good=[transform(x,train_mean,train_std) for x in baseline[:5]]\nserve_bad=[transform(x,0.0,1.0) for x in baseline[:5]]\nprint(\"共享状态最大差:\",max(abs(a-b) for a,b in zip(train_view,serve_good)))\nprint(\"错误状态最大差:\",max(abs(a-b) for a,b in zip(train_view,serve_bad)))"}]}],"source":[136]},{"type":"code","title":"03_labeling_storage_budget｜代码片段1","units":[{"title":"03_labeling_storage_budget｜代码片段1","context":"代码案例（Jupyter Notebook）","source":[137],"parts":[{"type":"code","text":"labels={\n \"easy_1\":[1,1,1],\"easy_2\":[0,0,0],\"ambiguous_1\":[1,0,1],\n \"ambiguous_2\":[0,1,0],\"conflict\":[1,0,2]\n}\ndef agreement(xs):\n    counts={x:xs.count(x) for x in set(xs)}\n    return max(counts.values())/len(xs)\nfor item,xs in labels.items():\n    a=agreement(xs)\n    print(item,xs,\"agreement\",round(a,2),\"->\", \"专家升级\" if a<0.8 else \"接受\")"}]}],"source":[137]},{"type":"code","title":"03_labeling_storage_budget｜代码片段2","units":[{"title":"03_labeling_storage_budget｜代码片段2","context":"代码案例（Jupyter Notebook）","source":[138],"parts":[{"type":"code","text":"pool=10_000_000; budget=50_000; label_cost=0.50; score_cost=0.01\nfull_score=pool*score_cost\nprint(\"扫描整个池成本$\",full_score)\nremaining=budget-full_score\nprint(\"扫描后可用于标签$\",remaining)\nscore_budget=budget*0.10\nscorable=int(score_budget/score_cost)\nlabels_affordable=int((budget-score_budget)/label_cost)\nprint(\"若10%预算打分: 可筛\",scorable,\"个候选, 可标\",labels_affordable,\"个\")"}]}],"source":[138]},{"type":"reading","title":"把完整讲义收束为一个系统视角","units":[{"title":"把完整讲义收束为一个系统视角","context":"第2章 总结","source":[139],"parts":[{"type":"note","text":"数据是源代码：版本它、测试它、审查它，并持续监控它。"},{"type":"text","text":"数据工程把原始观察编译为可训练、可服务、可审计的数据工件；数据重力和feeding tax约束移动与供给；四支柱贯穿采集、摄取、处理、标签和存储；训练—服务一致性、幂等和谱系保证可靠；版本控制、特征库与数据债管理保证长期健康。"}]}],"source":[139]}]};

const $=s=>document.querySelector(s);
const escape=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weight=t=>[...t].reduce((a,c)=>a+(c.charCodeAt(0)>255?1:.53),0);
const tidy=t=>String(t).replace(/\s*（\d+\/\d+）$/,'');
function formula(t){return escape(t).replace(/([A-Za-z][A-Za-z0-9]*)_([A-Za-z0-9]+)/g,'$1<sub>$2</sub>');}
function highlight(t){return t.split('\n').map(line=>{let comment=line.match(/^(\s*#.*)$/);if(comment)return '<span class="comment">'+escape(line)+'</span>';let chunks=line.split(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g);return chunks.map((s,i)=>i%2?'<span class="str">'+escape(s)+'</span>':escape(s).replace(/\b(def|class|return|import|from|as|if|else|elif|for|while|in|and|or|not|True|False|None|with|try|except|print)\b/g,'<span class="kw">$1</span>')).join('');}).join('\n');}
function unitHTML(u,page,exclude=[]){let parts=u.parts.filter(p=>!exclude.includes(p.type));let title=tidy(u.title)!==tidy(page.title)?u.title:'';let body='';let i=0;for(const p of parts){if(p.type==='text')body+='<p class="'+(i++===0&&p.text.length<48?'lead':'')+'">'+escape(p.text)+'</p>';else if(p.type==='note')body+='<aside class="note">'+escape(p.text)+'</aside>';else if(p.type==='heading'&&p.text!==u.title&&p.text!==page.title)body+='<p class="topic">'+escape(p.text)+'</p>';else if(p.type==='formula')body+='<div class="formula">'+formula(p.text)+'</div>';}
 if(!body&&!title)return '';return '<article class="unit">'+(title?'<h2>'+escape(title)+'</h2>':'')+body+'</article>';}
function textColumns(page){let us=page.units.map(u=>({unit:u,html:unitHTML(u,page),cost:u.parts.reduce((v,p)=>v+(p.text?weight(p.text):0)+(p.type==='formula'?140:20),45)})).filter(u=>u.html);let split=1;if(us.length>1){let sum=us.reduce((s,u)=>s+u.cost,0),acc=0,best=Infinity;for(let i=1;i<us.length;i++){acc+=us[i-1].cost;if(Math.abs(sum-2*acc)<best){best=Math.abs(sum-2*acc);split=i;}}}else if(us.length===1){let u=us[0].unit,parts=u.parts;if(parts.length>2){let halfway=Math.ceil(parts.length/2);return '<div class="columns"><div class="column">'+unitHTML({...u,parts:parts.slice(0,halfway)},page)+'</div><div class="column">'+unitHTML({...u,title:page.title,parts:parts.slice(halfway)},page)+'</div></div>';}}
 if(us.length===1&&us[0].unit.parts.length<=2)return '<div class="reading-focus">'+us[0].html+'</div>';
 const renderList=xs=>{let last='';return xs.map(x=>{let u=x.unit,t=u.title;let html=unitHTML(last===t?{...u,title:page.title}:u,page);last=t;return html;}).join('');};return '<div class="columns"><div class="column">'+renderList(us.slice(0,split))+'</div><div class="column">'+renderList(us.slice(split))+'</div></div>';}
function bodyHTML(page){let parts=page.units.flatMap(u=>u.parts);
 if(page.type==='cover'){let agenda=DATA.agenda.filter((t,i,a)=>!a.slice(0,i).some(s=>s.match(/^\d+\.\d+/)?.[0]===t.match(/^\d+\.\d+/)?.[0])).slice(0,12);return '<div class="cover-content"><div class="cover-title"><div class="cover-number">'+String(DATA.chapter).padStart(2,'0')+'</div><h1>'+escape(DATA.name)+'</h1><div class="subtitle">'+escape(DATA.cover.subtitle)+'</div><div class="ref">'+escape(DATA.cover.reference)+'</div></div><div class="cover-art">'+(DATA.cover.image?'<img data-zoom src="'+media[DATA.cover.image]+'" alt="'+escape(DATA.name)+'概念图">':'')+'</div><div class="cover-agenda"><h2>本章议题</h2><div class="agenda-list">'+agenda.map(t=>'<button data-topic="'+escape(t)+'">'+escape(t.replace(/（[^）]*）/g,''))+'</button>').join('')+'</div></div></div>';}
 if(page.type==='figure'){let imgs=parts.filter(p=>p.type==='image');return '<div class="figure-grid"><div class="visual '+(imgs.length>1?'multiple':'')+'">'+imgs.map(p=>'<img data-zoom src="'+media[p.file]+'" alt="'+escape(page.title)+'图示">').join('')+'</div><div class="figure-text">'+page.units.map(u=>unitHTML(u,page,['image'])).join('')+'</div></div>';}
 if(page.type==='formula'){let fs=parts.filter(p=>p.type==='formula');let rest={...page,units:page.units.map(u=>({...u,parts:u.parts.filter(p=>p.type!=='formula')}))};return '<div class="formula-layout">'+fs.map(p=>'<div class="formula">'+formula(p.text)+'</div>').join('')+textColumns(rest)+'</div>';}
 if(page.type==='table'){let tables=parts.filter(p=>p.type==='table');return '<div class="table-wrap">'+tables.map(tb=>'<table>'+tb.rows.map((row,r)=>'<tr>'+row.map(cell=>'<'+(r?'td':'th')+'>'+escape(cell)+'</'+(r?'td':'th')+'>').join('')+'</tr>').join('')+'</table>').join('')+'<div class="table-notes">'+page.units.map(u=>unitHTML(u,page,['table'])).join('')+'</div></div>';}
 if(page.type==='code'){return '<div class="code-layout"><div class="code-main">'+page.units.map(u=>u.parts.filter(p=>p.type==='code').map(p=>'<pre><code>'+highlight(p.text)+'</code></pre>').join('')).join('')+'</div><aside class="code-aside"><div><h3>运行与观察</h3>'+page.units.map(u=>unitHTML({...u,title:page.title},page,['code'])).join('')+'</div><div><button class="copy">复制代码</button><p class="copy-status">请结合前文变量与 Notebook 环境使用</p></div></aside></div>';}
 return textColumns(page);}
let index=0,darkOverride=null,reader=false;
const pageText=p=>p.title+' '+p.units.map(u=>u.title+' '+u.parts.map(x=>x.text||x.rows?.flat().join(' ')||'').join(' ')).join(' ');
function headHTML(page,i){return '<div class="topline"><span>Scalable ML Architectures</span><span>CHAPTER '+String(DATA.chapter).padStart(2,'0')+'　'+escape(DATA.name)+'</span></div>'+(page.type==='cover'?'':'<header class="heading"><h1>'+escape(page.title)+'</h1></header>');}
function footerHTML(i,interactive=true){return '<footer><a href="index.html">全部章节</a><div class="hints">← → 翻页　 / 搜索　 F 全屏　 R 阅读　 D 明暗</div><nav>'+(interactive?'<button id="toc" aria-label="目录">目录</button><button id="prev" aria-label="上一页">←</button><input id="jump" aria-label="跳转页码" value="'+(i+1)+'">':'<span>'+(i+1))+' / '+DATA.pages.length+(interactive?'<button id="next" aria-label="下一页">→</button>':'</span>')+'</nav></footer><div class="progress" style="width:'+((i+1)/DATA.pages.length*100)+'%"></div>';}
function fit(stage){let content=stage.querySelector('.content');if(!content)return;const type=stage.dataset.type;let z=type==='table'?27:type==='figure'?26:29;
 function measure(){let r=content.getBoundingClientRect(),scale=r.width/content.clientWidth;let nodes=[...content.querySelectorAll('.unit,.formula,table,pre,.cover-agenda')];let bottom=Math.max(r.top,...nodes.map(n=>n.getBoundingClientRect().bottom));return {overflow:Math.max(0,(bottom-r.bottom)/scale),scroll:content.scrollHeight-content.clientHeight};}
 content.style.fontSize=z+'px';while(z>21&&Math.max(measure().overflow,measure().scroll)>2){z--;content.style.fontSize=z+'px';}
 if(type==='code'){const box=content.querySelector('.code-main');const codes=[...box.querySelectorAll('pre')];let cz=26;const apply=()=>codes.forEach(n=>n.style.fontSize=cz+'px');apply();while(cz>17&&(box.scrollHeight>box.clientHeight+1||codes.some(n=>n.scrollWidth>n.clientWidth+1))){cz--;apply();}}
 if(type==='cover'){let h=content.querySelector('.cover-title h1');if(DATA.name.length>8)h.style.fontSize='54px';}
 if(Math.max(measure().overflow,measure().scroll)>2)content.classList.add('tight');stage.dataset.fontSize=z;return measure();}
function resize(){let s=$('#stage');let scale=Math.min(innerWidth/1600,innerHeight/900);s.style.transform='scale('+scale+')';s.style.left=(innerWidth-1600*scale)/2+'px';s.style.top=(innerHeight-900*scale)/2+'px';}
function go(n,save=true){index=Math.max(0,Math.min(DATA.pages.length-1,n));const p=DATA.pages[index],s=$('#stage');s.className=(darkOverride??(index===0||index%7===5))?'dark':'';s.dataset.type=p.type;s.innerHTML=headHTML(p,index)+'<main class="content">'+bodyHTML(p)+'</main>'+footerHTML(index);resize();fit(s);if(save){try{localStorage.setItem('mlsys-html-'+DATA.chapter,index);}catch{}history.replaceState(null,'','#p='+(index+1));}document.title='第'+DATA.chapter+'章 '+DATA.name+' · '+(index+1)+'/'+DATA.pages.length;bind();}
function bind(){$('#next')?.addEventListener('click',()=>go(index+1));$('#prev')?.addEventListener('click',()=>go(index-1));$('#toc')?.addEventListener('click',()=>showContents());$('#jump')?.addEventListener('change',e=>go(+e.target.value-1));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let n=DATA.pages.findIndex(p=>p.title===b.dataset.topic||p.units.some(u=>u.title===b.dataset.topic));if(n>=0)go(n);});document.querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>{let lb=$('#lightbox');lb.querySelector('img').src=img.src;lb.querySelector('img').className='';lb.showModal();});$('.copy')?.addEventListener('click',async()=>{let txt=DATA.pages[index].units.flatMap(u=>u.parts.filter(p=>p.type==='code').map(p=>p.text)).join('\n\n');try{await navigator.clipboard.writeText(txt);}catch{let el=document.createElement('textarea');el.value=txt;document.body.append(el);el.select();document.execCommand('copy');el.remove();}$('.copy-status').textContent='已复制完整代码';});}
function showContents(q=''){if(!$('#contents').open)$('#contents').showModal();$('#search').value=q;search(q);$('#search').focus();}
function search(q){let words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);$('#results').innerHTML=DATA.pages.map((p,i)=>({p,i,text:pageText(p).toLowerCase()})).filter(v=>words.every(w=>v.text.includes(w))).map(({p,i})=>'<button data-page="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b>　'+escape(p.title)+'<small>'+escape(p.units.flatMap(u=>u.parts.filter(x=>x.type==='text').map(x=>x.text)).join(' ').slice(0,80))+'</small></button>').join('');$('#results').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#contents').close();go(+b.dataset.page);});}
function reading(){reader=!reader;document.body.classList.toggle('reader',reader);if(reader){const holder=document.createElement('div');holder.id='reader-pages';DATA.pages.forEach((p,i)=>{let s=document.createElement('section');s.className='reader-page '+((i===0||i%7===5)?'dark':'');s.dataset.type=p.type;s.innerHTML=headHTML(p,i)+'<main class="content">'+bodyHTML(p)+'</main>'+footerHTML(i,false);holder.append(s);});$('#viewport').append(holder);holder.querySelectorAll('.reader-page').forEach(fit);holder.children[index]?.scrollIntoView();holder.querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>{let lb=$('#lightbox');lb.querySelector('img').src=img.src;lb.querySelector('img').className='';lb.showModal();});}else{$('#reader-pages')?.remove();go(index);}}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if($('#lightbox').open||$('#contents').open)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1);}if(e.key==='Home')go(0);if(e.key==='End')go(DATA.pages.length-1);if(e.key==='Escape'||e.key==='/'){e.preventDefault();showContents();}if(e.key.toLowerCase()==='f'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});}if(e.key.toLowerCase()==='d'){darkOverride=!$('#stage').classList.contains('dark');go(index);}if(e.key.toLowerCase()==='r')reading();});
let wheelAt=0;document.addEventListener('wheel',e=>{if(reader||$('dialog[open]'))return;if(Date.now()-wheelAt>500&&Math.abs(e.deltaY+e.deltaX)>20){wheelAt=Date.now();go(index+(e.deltaY+e.deltaX>0?1:-1));}},{passive:true});let touchX=0;document.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if($('dialog[open]'))return;let d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>60)go(index+(d<0?1:-1));},{passive:true});
$('#search').addEventListener('input',e=>search(e.target.value));$('#contents .close').onclick=()=>$('#contents').close();$('#lightbox button').onclick=()=>$('#lightbox').close();$('#lightbox img').onclick=e=>e.target.classList.toggle('zoomed');window.addEventListener('resize',resize);window.addEventListener('beforeprint',()=>{if(!reader)reading();});
let start=+(location.hash.match(/p=(\d+)/)?.[1]||0)-1;if(start<0){try{start=+(localStorage.getItem('mlsys-html-'+DATA.chapter)||0);}catch{start=0;}}go(start,false);
window.Lecture={go,fit:()=>fit($('#stage')),count:DATA.pages.length,data:DATA,search:showContents};
</script></body></html>
